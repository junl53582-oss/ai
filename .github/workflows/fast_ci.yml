name: Fast CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "reports/**/*.png"
      - "reports/**/*.jpg"
      - "reports/**/*.jpeg"
  pull_request:
    branches: [ main ]

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Core Fast Tests
        run: |
          python -m pytest -q \
            tests/test_factor_research.py \
            tests/test_pit_state_integrity.py \
            tests/test_evidence_integrity.py \
            tests/test_execution_safety.py \
            tests/test_no_leakage.py \
            tests/test_neutralization_parity.py \
            tests/test_model_research_integrity.py \
            tests/test_model_decision_certification.py \
            tests/test_model_seed_propagation.py \
            -m "not slow and not integration and not production"

      - name: Dataset Schema Gate
        run: |
          python -u tools/check_committed_dataset_schema.py

      - name: CI Smoke Research
        run: |
          python -u tools/run_factor_research.py --dataset data_storage/factors/factor_matrix.parquet --limit-factors 3 --output-dir reports/ci_smoke

      - name: CI Smoke Validator
        run: |
          python -u tools/validate_research_artifacts.py --mode ci-smoke --report-dir reports/ci_smoke

      - name: Upload Fast CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-ci-artifacts
          path: |
            artifacts/
            reports/ci_smoke/
