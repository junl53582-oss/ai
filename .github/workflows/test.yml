name: CI Test & Factor Research Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pytest Test Suite
        run: |
          python -m pytest -s --junitxml=artifacts/pytest.xml

      - name: Validate Committed Research Dataset Schema
        run: |
          python -u tools/check_committed_dataset_schema.py

      - name: Run Factor Research Pipeline (CI Smoke)
        run: |
          python -u tools/run_factor_research.py --dataset data_storage/factors/factor_matrix.parquet --limit-factors 3

      - name: Validate Research Artifacts & Lineage Evidence
        run: |
          python -u tools/validate_research_artifacts.py

      - name: Upload Pytest Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: artifacts/pytest.xml

      - name: Upload Factor Research Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-research-reports
          path: |
            reports/factor_research/
            FACTOR_RESEARCH_REPORT.md
