name: Full Certification

on:
  workflow_dispatch:

concurrency:
  group: full-certification
  cancel-in-progress: false

jobs:
  full-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Full Pytest Test Suite
        run: |
          python -m pytest -vv -s --durations=30 --junitxml=artifacts/pytest.xml

      - name: Validate Committed Research Dataset Schema
        run: |
          python -u tools/check_committed_dataset_schema.py

      - name: Run Factor Research Pipeline (CI Smoke)
        run: |
          python -u tools/run_factor_research.py --dataset data_storage/factors/factor_matrix.parquet --limit-factors 3 --output-dir reports/ci_smoke

      - name: Validate Research Artifacts & Lineage Evidence (CI Smoke)
        run: |
          python -u tools/validate_research_artifacts.py --mode ci-smoke --report-dir reports/ci_smoke

      - name: Upload Pytest Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pytest-results
          path: artifacts/pytest.xml

      - name: Upload Certification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-certification-reports
          path: |
            reports/
            FACTOR_RESEARCH_REPORT.md
