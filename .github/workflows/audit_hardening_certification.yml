name: Audit Hardening Certification & Integrity Regression Suite

on:
  push:
    branches: [ main, "phase2.1-*" ]
  pull_request:
    branches: [ main ]

jobs:
  integrity-audit-certification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Integrity Hardening Attack Test Suite (32 Gates)
        run: |
          python -m pytest -v tests/test_audit_hardening.py

      - name: Run Formal Research Runner E2E Smoke Test
        run: |
          python -m pytest -v tests/test_formal_research_runner_e2e.py

      - name: Run Full Pytest Regression Suite
        run: |
          python -m pytest -q
