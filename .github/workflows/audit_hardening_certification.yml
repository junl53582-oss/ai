name: Audit Hardening Certification & Integrity Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: integrity-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-audit-certification:
    runs-on: ubuntu-latest
    # 2026-09-07: 20min 硬超时掐死了 Full Pytest Regression Suite
    # （feature 分支较 main 多 ~7 万行代码后全量套件需要更久；前 3 个门禁套件全绿，
    #   失败时间线与 timeout 时刻吻合）。放宽到 60min 并保留 concurrency 取消机制。
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Integrity Hardening Attack Test Suite (32 Gates)
        run: |
          python -m pytest -v tests/test_audit_hardening.py

      - name: Run r3.2 Evidence Integrity Adversarial Tests
        run: |
          python -m pytest -v tests/test_r3_2_evidence_integrity.py

      - name: Run Formal Research Runner E2E Smoke Test
        run: |
          python -m pytest -v tests/test_formal_research_runner_e2e.py

      - name: Run Full Pytest Regression Suite
        run: |
          python -m pytest -q
