name: Production Research Audit

on:
  workflow_dispatch:

concurrency:
  group: production-research-audit
  cancel-in-progress: false

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: "Fail-Closed Market Dataset Gate (Phase A: 行情主数据集已入库)"
        run: |
          python -u -c "import sys, pyarrow.parquet as pq; from pathlib import Path; p = Path('data_storage/research/market_daily_300.parquet'); sys.exit('Production market dataset market_daily_300.parquet missing! Fail-Closed.') if not p.exists() else None; f = pq.ParquetFile(p); sys.exit(f'Row count drifted: {f.metadata.num_rows}') if f.metadata.num_rows != 349379 else print(f'Market dataset OK: {f.metadata.num_rows} rows')"

      - name: "Factor Matrix Reproducibility Check (Phase A)"
        run: |
          if [ ! -f data_storage/research/factor_matrix_300.parquet ]; then
            echo "::error::认证级因子矩阵 factor_matrix_300.parquet (311MB) 未入库, 且当前无法从入库代码+数据位级复现。"
            echo "::error::已知差异: 缺 10+ 注册表因子列 (FLOW_*/GP_ALPHA_* 等), LOG_CIRC_MV 等基础列数值不一致。"
            echo "::error::修复 tools/build_factor_matrix_300.py 复现一致性后, 本地执行 --output 重建并重跑校验。"
            exit 1
          fi
          python -u tools/build_factor_matrix_300.py

      - name: Run Production 300x79 Factor Research
        run: |
          python -u tools/run_factor_research.py --dataset data_storage/research/factor_matrix_300.parquet --output-dir reports/production_research

      - name: Validate Production Research Artifacts
        run: |
          python -u tools/validate_research_artifacts.py --mode production --report-dir reports/production_research

      - name: Upload Production Research Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-research-reports
          path: |
            reports/production_research/
