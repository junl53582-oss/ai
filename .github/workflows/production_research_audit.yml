name: Production Research Audit

on:
  workflow_dispatch:

concurrency:
  group: production-research-audit
  cancel-in-progress: false

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail-Closed Production Dataset Gate
        run: |
          python -u -c "from pathlib import Path; p = Path('data_storage/research/factor_matrix_300.parquet'); assert p.exists(), 'Production dataset factor_matrix_300.parquet missing! Fail-Closed.'"

      - name: Run Production 300x79 Factor Research
        run: |
          python -u tools/run_factor_research.py --dataset data_storage/research/factor_matrix_300.parquet --output-dir reports/production_research

      - name: Validate Production Research Artifacts
        run: |
          python -u tools/validate_research_artifacts.py --mode production --report-dir reports/production_research

      - name: Upload Production Research Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-research-reports
          path: |
            reports/production_research/
