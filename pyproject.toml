[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ai-platform"
version = "4.5.0"
description = "A-Share Institutional AI Quantitative Research, Forward Price Forecasting & Trading Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "fastparquet>=2023.10.0",
    "cryptography>=41.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
research = [
    "optuna>=3.0.0",
    "akshare>=1.12.0",
]
deep = [
    "torch>=2.0.0",
]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pyyaml>=6.0.0",
]
all = [
    "optuna>=3.0.0",
    "akshare>=1.12.0",
    "torch>=2.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pyyaml>=6.0.0",
]
